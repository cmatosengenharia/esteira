# Infra sempre sobe (postgres, rabbitmq). API e Workers rodam no Mac com `dotnet run`
# OU dentro do Docker com `docker compose --profile app up --build` (mesma imagem da CI).
services:
  postgres:
    image: postgres:16
    container_name: esteira-postgres
    environment:
      POSTGRES_USER: esteira
      POSTGRES_PASSWORD: esteira
      POSTGRES_DB: esteira
    ports:
      - "5432:5432"
    volumes:
      - esteira-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esteira -d esteira"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    container_name: esteira-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: esteira
      RABBITMQ_DEFAULT_PASS: esteira
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - esteira-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    profiles: ["app"]
    build: { context: ., dockerfile: Dockerfile.dev }
    image: esteira-dev
    container_name: esteira-api
    command: dotnet run --project src/Esteira.Api --no-launch-profile
    working_dir: /src
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Database=esteira;Username=esteira;Password=esteira
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: esteira
      RabbitMq__Password: esteira
    ports:
      - "5080:5080"
    volumes:
      - .:/src
      - esteira-nuget:/root/.nuget/packages
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  workers:
    profiles: ["app"]
    image: esteira-dev
    container_name: esteira-workers
    command: dotnet run --project src/Esteira.Workers
    working_dir: /src
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Database=esteira;Username=esteira;Password=esteira
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: esteira
      RabbitMq__Password: esteira
    volumes:
      - .:/src
      - esteira-nuget:/root/.nuget/packages
    depends_on:
      api: { condition: service_started }

volumes:
  esteira-pgdata:
  esteira-rabbitmq:
  esteira-nuget:
